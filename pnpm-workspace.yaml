# Workspace globs use explicit patterns (not **) for future compatibility with Turborepo.
# Group folders (e.g. examples/react-grid/) have no package.json; examples live one level below.
# https://turborepo.dev/docs/crafting-your-repository/structuring-a-repository#declaring-directories-for-packages
packages:
  - docs
  - examples/react-grid/*
  - examples/vue-grid/*
  - examples/vanilla-grid/*
  - packages/*
  - packages/grid-examples/*
  - packages/grid-plugins-shared/*
  - packages/react-grid-plugins/*
  - packages/vanilla-grid-plugins/*
  - packages/vue-grid-plugins/*

allowBuilds:
  esbuild: true
  sharp: true # for nextra-theme-docs
  unrs-resolver: true # for nextra-theme-docs

catalog:
  tsdown: "^0.x"
  typescript: "npm:@typescript/typescript6@^6.0.2"
  typescript-7: "npm:typescript@^7.0.2"

linkWorkspacePackages: true

packageExtensions:
  # react-error-boundary is missing @types/react in its dependencies.
  # This causes pnpm's strict symlinking to evaluate its types to `any`, leading to JSX errors.
  # Injecting it here forces pnpm to provide the types.
  "react-error-boundary@*":
    peerDependencies:
      "@types/react": "^19.0.0"
